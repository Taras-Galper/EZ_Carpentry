<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EZ Carpentry</title>
<style>
:root{--bg:#faf9f6;--panel:#fff;--line:#e3dfd6;--ink:#1f1d1a;--mute:#7a746a;--acc:#2f6fe4;--warn:#b5481b;font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .logo{font-weight:700;letter-spacing:.02em;margin-right:10px}
header .sp{flex:1}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#bdb7ab}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--warn)}
header select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
main{display:grid;grid-template-columns:250px 1fr 300px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{border-left:1px solid var(--line);padding:10px 12px}
#list{list-style:none;margin:0;padding:6px;flex:1}
#palette{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 6px;border-bottom:1px solid var(--line)}
#palette button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;font-size:10px;letter-spacing:-.01em;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#palette button:hover{color:var(--ink);background:#f3f1ec}
#palette svg{display:block}
#roombar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:8px 6px 0}
#roombar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;font-size:11px;color:var(--ink)}
#roombar button.pri{grid-column:span 1}
#roombar button svg{display:block;flex:none}
#roombar button.pri{color:#fff}
#v-3d.drawing canvas{cursor:crosshair}
#list li{display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;padding:6px 8px;border-radius:6px;cursor:pointer;column-gap:6px}
#list li b{grid-row:span 2;font-variant-numeric:tabular-nums;color:var(--mute);font-weight:600}
#list li em{font-style:normal;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#list li:hover{background:#f3f1ec}#list li.sel{background:#e7effd}
#projbtn{margin:6px;text-align:left}
#center{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
#tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);align-items:end}
#tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--mute)}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#tabs .sp{flex:1}#tabs label{display:flex;gap:4px;align-items:center;padding:6px;color:var(--mute)}
.view{min-height:0;overflow:auto;position:relative}
#v-3d{overflow:hidden}#v-3d canvas{display:block;position:absolute;inset:0}
button.pri:disabled{background:#9db7e8;border-color:#9db7e8}
#v-parts{display:grid;grid-template-columns:1fr 340px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--bg);font-weight:600;color:var(--mute)}
td.n{text-align:right}tbody tr{cursor:pointer}tbody tr:hover{background:#f3f1ec}tr.sel{background:#e7effd!important}
.preview{border-left:1px solid var(--line);padding:12px;background:var(--panel);overflow:auto}
.preview svg{display:block;margin:10px auto;max-width:100%}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}dt{color:var(--mute)}dd{margin:0}
#v-sheets{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-content:start;grid-auto-rows:max-content}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto}figure{display:flex;flex-direction:column}
figcaption{display:flex;gap:6px;align-items:center;padding:6px 8px;border-top:1px solid var(--line)}figcaption span{flex:1}
#v-drawings{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-content:start;align-items:start;grid-auto-rows:max-content}
#v-drawings img{background:#fff}
#v-drawings figure.wide{grid-column:1/-1}
#views{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 6px}
#tabs #views button{border:none;border-radius:0;padding:4px 10px;color:var(--mute)}
#tabs #views button.on{background:var(--ink);color:#fff}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#drawsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wlabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px;font-variant-numeric:tabular-nums}
.wlabel.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vhandle{position:absolute;left:0;top:0;width:12px;height:12px;background:#fff;border:2px solid var(--acc);border-radius:2px;pointer-events:auto;cursor:move}
.vhandle.fixed{background:var(--acc)}
table.hw input.code{width:100%;min-width:120px;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px;font:inherit}table.hw input.code:hover,table.hw input.code:focus{border-color:var(--line);background:#fff}
.qprices .logo img{max-height:40px;max-width:160px;margin-right:auto}.qprices textarea{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;resize:vertical}
.snapchip{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;gap:8px;align-items:center;padding:3px 9px;border-radius:12px;background:#2f6fe4;color:#fff;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.2)}.snapchip b{font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{flex:1;border:none;border-radius:0;padding:6px 4px;color:var(--mute);background:#fff}.seg button.on{background:var(--ink);color:#fff}.vhandle.mid{border-radius:50%;pointer-events:none}
#dial{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 6px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#dial label{display:flex;align-items:center;gap:4px;margin:0;color:var(--mute);font-size:12px;font-weight:600}
#dial input{width:64px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-variant-numeric:tabular-nums;text-align:right}
#plantools{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2}
#plantools button{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#plantools button.pri{background:var(--acc);color:#fff}#plantools button.pri:disabled{background:#9db7e8;border-color:#9db7e8}
.fill{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px}
.grow{flex:1}
#presets{padding:0 6px}#presets:empty{display:none}#presets h3{margin:8px 2px 4px}
.preset{display:flex;gap:4px;margin-bottom:4px}.preset button.grow{text-align:left}
.defaults{margin-top:10px}
#projects{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:8vh 12px}
#projects[hidden]{display:none!important}
.dlg{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(640px,100%);max-height:80vh;overflow:auto;padding:14px 16px}
.dlg h2{margin:0;font-size:18px}.dlg table{margin-top:10px}.dlg td{white-space:nowrap}.dlg tr.sel td{background:#e7effd}
#coords{color:var(--mute);font-variant-numeric:tabular-nums;padding:6px;white-space:pre}
button:disabled{opacity:.4;cursor:default}
#v-quote{display:grid;grid-template-columns:1fr 300px}
.qdoc{padding:16px 20px;overflow:auto}.qdoc h2{flex:1;margin:0;font-size:20px}
.qdoc table{margin-top:10px}.qdoc td{white-space:normal;vertical-align:top}.qdoc td.n{white-space:nowrap}
.qdoc tfoot td{border:none;padding:4px 8px}.qdoc tr.total td{font-weight:700;font-size:15px;border-top:2px solid var(--ink)}
.mute{color:var(--mute)}
.qprices{border-left:1px solid var(--line);background:var(--panel);padding:4px 12px 12px;overflow:auto}
#v-hw{padding:12px;display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start}
table.hw tbody tr{cursor:default}
h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.row{display:flex;gap:6px;align-items:center}.row h3{flex:1;margin:4px 0}
label{display:block;margin:6px 0}label>span{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
label input,label select{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:#fff}
label.chk{display:flex;align-items:center;gap:8px;margin-top:22px}label.chk span{margin:0;order:2}label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.mat{border-top:1px solid var(--line);padding-top:4px}
.tool{border-top:1px solid var(--line);padding-top:4px}.grid4{display:grid;grid-template-columns:.7fr 1fr 1.2fr 1.2fr;gap:0 6px}
footer#status{display:flex;gap:16px;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel);color:var(--mute);overflow:auto;white-space:nowrap}
.warn{color:var(--warn)}
#toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,20px);background:#222;color:#fff;padding:8px 14px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fatal{padding:20px;color:var(--warn);white-space:pre-wrap}
.menu{display:contents}.m-only{display:none}
#v-3d canvas{touch-action:none}

/* ---------- phone ---------- */
@media (max-width:760px){
  body{grid-template-rows:auto 1fr auto}
  header{padding:6px 8px;gap:4px}
  header .logo{margin-right:auto;font-size:14px}
  header .sp{display:none}
  header .menu{display:none}
  header.open .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex-basis:100%;order:2}
  header .logo{order:0}#undo,#redo,#more{order:1}
  header.open{flex-wrap:wrap;row-gap:6px}
  .dlg tr{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
  .dlg td{border:none;padding:3px 6px}.dlg td:nth-child(3){grid-column:1/-1;font-size:12px}
  .dlg td.n{grid-column:1/-1;text-align:left;display:flex;gap:6px}.dlg td.n button{flex:1;padding:8px}
  header.open .menu button{padding:9px 4px}
  .m-only{display:inline-flex;align-items:center;justify-content:center}
  #more{font-size:18px;line-height:1;padding:4px 12px}
  #undo,#redo{padding:5px 12px}
  main{display:block;position:relative;min-height:0}
  #center{height:100%}
  footer#status{display:none}
  #toast{bottom:76px}
  #viewbar{position:absolute;top:8px;right:8px;z-index:3;display:flex;gap:6px}
  #viewbar #views{margin:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  #viewbar #views button{border:none;border-radius:0;padding:7px 12px;color:var(--mute);background:#fff}
  #viewbar #views button.on{background:var(--ink);color:#fff}
  #viewbar #fit{background:#fff;padding:7px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  #tabs{overflow-x:auto;flex-wrap:nowrap;padding:4px 6px 0;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{padding:8px 10px;flex:none}
  #tabs .sp,#coords{display:none}
  #tabs label{flex:none}
  #views{flex:none}
  /* side panels become sheets that slide up above the bottom bar */
  #left,#right{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));max-height:62vh;z-index:20;border:none;border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);transform:translateY(calc(100% + 60px));transition:transform .2s ease;overflow:auto;padding-top:6px}
  #left::before,#right::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#d6d1c7;margin:0 auto 6px}
  body.sheet-left #left,body.sheet-right #right{transform:none}
  #right{padding:6px 14px 16px}
  #palette{grid-template-columns:repeat(5,1fr)}
  #mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:21}
  #mbar button{padding:10px;font-size:14px;font-weight:600}
  #mbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #mbsel{font-weight:400;opacity:.7;margin-left:4px}
  #dial{left:6px;right:6px;bottom:6px;justify-content:space-between}
  #dial label{flex:1;min-width:0}
  #dial input{width:100%;min-width:0;padding:7px 5px;font-size:15px}
  .vhandle{width:24px;height:24px;border-width:3px;border-radius:5px}
  .wlabel{padding:4px 9px;font-size:13px}
  #plantools{left:6px;top:6px}
  #plantools button{padding:9px 14px}
  label input,label select{padding:8px 7px;font-size:16px}
  #v-parts,#v-hw,#v-quote{display:block}
  #v-parts .tablewrap{max-height:none}
  .preview{border-left:none;border-top:1px solid var(--line)}
  #v-sheets,#v-drawings{grid-template-columns:1fr;padding:8px}
  .qprices{border-left:none;border-top:1px solid var(--line)}
  .qdoc{padding:12px}
  #v-hw table{margin-bottom:16px}
  th,td{padding:6px 6px}
}
</style>
</head>
<body>
<header>
  <span class="logo">EZ Carpentry</span>
  <div class="menu"><button id="new">New</button><button id="projectsbtn">Projects</button><button id="open">Open</button><button id="save">Save</button><button id="sample">Sample</button></div>
  <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
  <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
  <input id="dxffile" type="file" accept=".dxf" hidden>
  <span class="sp"></span>
  <div class="menu"><button id="packet">Shop packet</button><button id="labels">Labels</button><button id="csv">Cut list</button><button id="obj">OBJ</button><button id="zip" class="pri">Export CNC</button></div>
  <button id="more" class="m-only" aria-label="Menu" aria-expanded="false">⋯</button>
</header>
<main>
  <aside id="left"><div id="roombar"></div><div id="palette"></div><div id="presets"></div><button id="projbtn">Project &amp; materials</button><ul id="list"></ul></aside>
  <section id="center">
    <nav id="tabs">
      <button data-tab="3d">3D</button><button data-tab="parts">Parts</button><button data-tab="sheets">Sheets</button><button data-tab="hw">Hardware</button><button data-tab="drawings">Drawings</button><button data-tab="quote">Quote</button>
      <span class="sp"></span>
      <span id="coords"></span>
      <span id="views"><button data-view="3d" class="on">3D</button><button data-view="plan">Plan</button><button data-view="front">Front</button></span>
      <label><input id="fronts" type="checkbox" checked>Fronts</label>
      <button id="fit">Fit</button><button id="shot" title="Save a picture of the view">Image</button>
    </nav>
    <div class="view" id="v-3d"><div id="overlay"></div><svg id="drawsvg"></svg><div id="plantools" hidden></div><div id="viewbar"></div>
      <div id="dial" hidden title="Type a value, or +n / -n to move by n">
        <label>X<input data-k="x" inputmode="decimal"></label><label>Y<input data-k="y" inputmode="decimal"></label><label>Z<input data-k="z" inputmode="decimal"></label><label>↻<input data-k="r" inputmode="decimal"></label>
      </div></div>
    <div class="view" id="v-parts" hidden></div>
    <div class="view" id="v-sheets" hidden></div>
    <div class="view" id="v-hw" hidden></div>
    <div class="view" id="v-drawings" hidden></div>
    <div class="view" id="v-quote" hidden></div>
  </section>
  <aside id="right"><div id="props"></div></aside>
</main>
<footer id="status"></footer>
<nav id="mbar" class="m-only"><button data-sheet="left">Cabinets</button><button data-sheet="right">Edit <b id="mbsel"></b></button></nav>
<div id="toast"></div>
<div id="projects" hidden></div>
<script>/*BUNDLE*/</script>
</body>
</html>
