name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cli:
    # macOS runners are often short on capacity and can sit unassigned until
    # GitHub gives up, failing the whole run. Build macOS only on a manual run
    # (Actions > build > Run workflow).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["windows-latest","ubuntu-latest","macos-latest"]') || fromJSON('["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo test -p casework-core
      - run: cargo build --release -p casework
      - uses: actions/upload-artifact@v6
        with:
          name: casework-${{ matrix.os }}
          path: |
            target/release/casework
            target/release/casework.exe
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: ./build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
